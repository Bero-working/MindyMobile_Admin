appId: com.mindymobile_admin
name: 'P1 UI mock - all seven screens (real P0 login, fixture P1 data)'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 120000
- tapOn:
    id: login-email-input
- inputText:
    text: ${MAESTRO_MENTOR_EMAIL}
    label: Enter mentor test email
- tapOn:
    id: login-password-input
- inputText:
    text: ${MAESTRO_MENTOR_PASSWORD}
    label: Enter mentor test password
- scrollUntilVisible:
    element:
      id: login-submit-button
    direction: DOWN
- tapOn:
    id: login-submit-button
- extendedWaitUntil:
    visible:
      id: workspace-open-schedule
    timeout: 30000
- assertVisible: Tiện ích yêu thích
- assertNotVisible:
    id: workspace-open-manager-classes
- takeScreenshot: build-logs/phase-1/ui/home-mentor-vi-light
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: workspace-open-schedule
    timeout: 30000
- tapOn:
    id: workspace-account-button
- assertVisible:
    id: profile-screen
- pressKey: Back
- tapOn:
    id: workspace-open-schedule
- assertVisible:
    id: schedule-session-today-primary
- takeScreenshot: build-logs/phase-1/ui/schedule
- tapOn:
    id: schedule-session-today-primary
- assertVisible:
